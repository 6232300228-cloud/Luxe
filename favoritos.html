<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Favoritos - Luxe</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
  <a href="index.html">
    <img src="img/logo.png" alt="Logo de la empresa" class="logo">
  </a>
  <div class="icons">
    <a href="login.html" id="login-btn">👤 Iniciar sesión</a>
    <span id="user-name" style="display:none;"></span>
    <a href="carrito.html">🛒 <span id="cart-count">0</span></a>
    <a href="index.html">Inicio</a>
  </div>
</header>

<main class="container">
  <!-- Header de favoritos para móvil -->
  <div class="favorites-header-mobile">
    <h2 class="favorites-title">Mis Favoritos</h2>
    <button class="btn-vaciar-fav-mobile" id="vaciar-favoritos-mobile" style="display: none;">Vaciar</button>
  </div>
  
  <!-- Contenedor de productos favoritos -->
  <section class="products" id="fav-items">
    <!-- Mensaje de favoritos vacío (se mostrará cuando no haya productos) -->
    <div class="empty-favorites-message" id="empty-favorites-message" style="display: none;">
      <p>No tienes productos favoritos</p>
      <a href="index.html" class="btn-continuar-fav">Descubrir productos</a>
    </div>
  </section>
</main>

<footer class="footer-luxe">
  <div class="footer-container">
    <div class="footer-column">
      <img src="img/logo.png" alt="Luxe Logo" class="footer-logo" onerror="this.src='https://via.placeholder.com/150x50?text=LUXE'">
      <p class="footer-description">Realzando tu belleza natural con productos de alta gama.</p>
      <h3>Encuéntranos en</h3>
      <div class="social-links">
        <a href="https://www.instagram.com/tiendaluxeedb/"><img src="img/ig.png" alt="Logo Luxe" class="logo"></a>                
        <a href="https://facebook.com" target="_blank">FB</a>
        <a href="https://tiktok.com" target="_blank">TK</a>
      </div>
    </div>

    <div class="footer-column newsletter">
      <h3>Únete al Club Luxe</h3>
      <p>Recibe ofertas exclusivas.</p>
      <div class="newsletter-form">
        <input type="email" id="newsletter-email" placeholder="Tu email...">
        <button onclick="suscribirse()">Unirse</button>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <p>&copy; 2026 LUXE Beauty Shop. Todos los derechos reservados.</p>
  </div>
</footer>

<script src="js/favoritos.js"></script>
<script src="js/user.js"></script>
</body>
</html>
