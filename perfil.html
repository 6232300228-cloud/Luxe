<!-- perfil.html - Versión actualizada con dirección detallada -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Luxe</title>
  <link rel="icon" href="img/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css?v=20250313">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <header class="header">
    <a href="index.html">
      <img src="img/logo.png" alt="Logo de la empresa" class="logo">
    </a>
    <div class="icons">
      <a href="index.html">Inicio</a>
      <a href="pedidos.html">Mis pedidos</a>
      <a href="login.html" id="login-btn">👤 Iniciar sesión</a>
      <span id="user-name" style="display:none;"></span>
      <button id="logout-btn" style="display:none;">Salir</button>
    </div>
  </header>

  <div class="perfil-container">
    <div class="perfil-avatar">
      <div class="avatar-circle" id="avatarInicial"></div>
    </div>
    
    <h2>Mi Perfil</h2>
    
    <!-- Sección de información personal -->
    <div class="perfil-section">
      <h3>Información Personal</h3>
      
      <div class="perfil-campo">
        <label>Nombre completo</label>
        <input type="text" id="perfilNombreInput" placeholder="Tu nombre completo">
      </div>
      
      <div class="perfil-campo">
        <label>Correo electrónico</label>
        <input type="email" id="perfilCorreoInput" placeholder="correo@ejemplo.com">
      </div>
      
      <div class="perfil-campo">
        <label>Teléfono</label>
        <div class="phone-input-container">
          <span class="phone-prefix">+52</span>
          <input type="tel" id="perfilTelefonoInput" placeholder="5544332211" maxlength="10">
        </div>
      </div>
    </div>
    
    <!-- Sección de dirección -->
    <div class="perfil-section">
      <h3>Dirección de Envío</h3>
      
      <div class="direccion-grid">
        <div class="perfil-campo">
          <label>Calle</label>
          <input type="text" id="perfilCalleInput" placeholder="Calle">
        </div>
        
        <div class="perfil-campo">
          <label>Número</label>
          <input type="text" id="perfilNumeroInput" placeholder="Número">
        </div>
        
        <div class="perfil-campo full-width">
          <label>Colonia</label>
          <input type="text" id="perfilColoniaInput" placeholder="Colonia">
        </div>
        
        <div class="perfil-campo">
          <label>Estado</label>
          <input type="text" id="perfilEstadoInput" placeholder="Estado">
        </div>
        
        <div class="perfil-campo">
          <label>Código Postal</label>
          <input type="text" id="perfilCpInput" placeholder="C.P." maxlength="5">
        </div>
        
        <div class="perfil-campo full-width">
          <label>Referencia</label>
          <input type="text" id="perfilReferenciaInput" placeholder="Entre calles, color de casa, etc.">
        </div>
      </div>
    </div>
    
    <!-- Sección de pago -->
    <div class="perfil-section">
      <h3>Método de Pago</h3>
      
      <div class="perfil-campo">
        <label>Tarjeta</label>
        <input type="text" id="perfilTarjetaInput" placeholder="0000 0000 0000 0000" maxlength="19">
      </div>
    </div>
    
    <button id="btnGuardar">Guardar todos los cambios</button>
  </div>
  
  <footer class="footer-luxe">
    <div class="footer-container">
      <div class="footer-column">
        <img src="img/logo.png" alt="Luxe Logo" class="footer-logo" onerror="this.src='https://via.placeholder.com/150x50?text=LUXE'">
        <p class="footer-description">Realzando tu belleza natural con productos de alta gama.</p>
        <h3>Encuéntranos en</h3>
        <div class="social-links">
          <a href="https://www.instagram.com/tiendaluxeedb/"><img src="img/ig.png" alt="Instagram" class="logo"></a>
          <a href="https://www.tiktok.com/@luxecollection_1?_r=1&_t=ZS-950CZexEpLc"><img src="img/tiktok.png" alt="Logo Luxe" class="logo"></a>                

        </div>
      </div>
      
      <div class="footer-column newsletter">
        <h3>Únete al Club Luxe</h3>
        <p>Recibe ofertas exclusivas.</p>
        <div class="newsletter-form">
          <input type="email" id="newsletter-email" placeholder="Tu email...">
          <button onclick="suscribirse()">Unirse</button>
        </div>
      </div>
    </div>
    
    <div class="footer-bottom">
      <p>&copy; 2026 LUXE Beauty Shop. Todos los derechos reservados.</p>
    </div>
  </footer>
  
  <script src="js/perfil.js?v=20250313"></script>
  <script src="js/user.js?v=20250313"></script>
  <script>
    // Mostrar inicial del nombre en el avatar
    document.addEventListener('DOMContentLoaded', function() {
      const user = JSON.parse(localStorage.getItem("user"));
      if (user && user.nombre) {
        const inicial = user.nombre.charAt(0).toUpperCase();
        document.getElementById('avatarInicial').textContent = inicial;
      }
    });
  </script>
</body>
</html>
